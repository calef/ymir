[package]
name = "ymir-biome"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Biome classification and palette assignment from climate data"
documentation = "https://docs.rs/ymir-biome"
keywords = ["simulation", "worldgen", "biome", "ecology"]
categories = ["simulation", "science"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ymir-core = { path = "../ymir-core", version = "0.1.0" }
ymir-atmosphere = { path = "../ymir-atmosphere", version = "0.1.0" }
ymir-climate = { path = "../ymir-climate", version = "0.1.0" }
ymir-surface = { path = "../ymir-surface", version = "0.1.0" }

[dev-dependencies]
serde_json = "1"
bincode = "1"
ymir-system = { path = "../ymir-system", version = "0.1.0" }
ymir-catalog = { path = "../ymir-catalog", version = "0.1.0" }
