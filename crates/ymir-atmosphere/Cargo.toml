[package]
name = "ymir-atmosphere"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Atmospheric modeling: retention, composition, and greenhouse effect calculations"
documentation = "https://docs.rs/ymir-atmosphere"
keywords = ["simulation", "worldgen", "atmosphere", "greenhouse"]
categories = ["simulation", "science"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ymir-core = { path = "../ymir-core", version = "0.1.0" }
ymir-system = { path = "../ymir-system", version = "0.1.0" }
ymir-catalog = { path = "../ymir-catalog", version = "0.1.0" }

[dev-dependencies]
serde_json = "1"
