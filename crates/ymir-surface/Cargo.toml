[package]
name = "ymir-surface"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Global surface generation: geodesic grids, tectonics, and macro-scale heightmaps"

[dependencies]
noise = "0.9"
serde = { version = "1", features = ["derive"] }
ymir-core = { path = "../ymir-core" }
ymir-system = { path = "../ymir-system" }
ymir-atmosphere = { path = "../ymir-atmosphere" }

[dev-dependencies]
serde_json = "1"
ymir-catalog = { path = "../ymir-catalog" }
