[package]
name = "ymir-surface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Global surface generation: geodesic grids, tectonics, and macro-scale heightmaps"
documentation = "https://docs.rs/ymir-surface"
keywords = ["simulation", "worldgen", "geology", "heightmap", "geodesic"]
categories = ["simulation", "science"]

[dependencies]
noise = "0.9"
serde = { version = "1", features = ["derive"] }
ymir-core = { path = "../ymir-core", version = "0.1.0" }
ymir-system = { path = "../ymir-system", version = "0.1.0" }
ymir-atmosphere = { path = "../ymir-atmosphere", version = "0.1.0" }

[dev-dependencies]
serde_json = "1"
ymir-catalog = { path = "../ymir-catalog", version = "0.1.0" }
