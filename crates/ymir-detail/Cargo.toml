[package]
name = "ymir-detail"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Detail-level terrain generation: rivers, local features, and chunk-based refinement"

[dependencies]
serde = { version = "1", features = ["derive"] }
ymir-core = { path = "../ymir-core" }
ymir-surface = { path = "../ymir-surface" }
ymir-climate = { path = "../ymir-climate" }
ymir-biome = { path = "../ymir-biome" }
