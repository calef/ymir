[package]
name = "ymir-detail"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Detail-level terrain generation: rivers, local features, and chunk-based refinement"
documentation = "https://docs.rs/ymir-detail"
keywords = ["simulation", "worldgen", "terrain", "hex-grid"]
categories = ["simulation", "science"]

[dependencies]
serde = { version = "1", features = ["derive"] }
rand = "0.10"
rand_pcg = "0.3"
ymir-core = { path = "../ymir-core", version = "0.1.0" }
ymir-surface = { path = "../ymir-surface", version = "0.1.0" }
ymir-climate = { path = "../ymir-climate", version = "0.1.0" }
ymir-biome = { path = "../ymir-biome", version = "0.1.0" }

[dev-dependencies]
bincode = "1"
serde_json = "1"
ymir-atmosphere = { path = "../ymir-atmosphere", version = "0.1.0" }
ymir-catalog = { path = "../ymir-catalog", version = "0.1.0" }
ymir-system = { path = "../ymir-system", version = "0.1.0" }
