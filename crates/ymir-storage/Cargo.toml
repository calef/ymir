[package]
name = "ymir-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "World persistence: save/load world files with manifest tracking"
documentation = "https://docs.rs/ymir-storage"
keywords = ["simulation", "worldgen", "serialization", "persistence"]
categories = ["encoding", "simulation"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "3"
ymir-core = { path = "../ymir-core", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"
